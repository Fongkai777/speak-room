<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speak Room</title>
    <link rel="stylesheet" href="/styles.css?v=20260919-6" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <h1 class="brand-title">Speak Room</h1>
          <div class="status-pill" id="keyStatus">
            <span class="status-dot idle"></span>
            <span>检查中</span>
          </div>
        </header>

        <div class="workspace-body">
          <aside class="side-calendar" aria-label="练习日历">
            <section class="stats-block calendar-block">
              <div class="stats-block-head">
                <h3>练习日历</h3>
                <select class="calendar-month-select" id="calendarMonthSelect" aria-label="日历月份"></select>
              </div>
              <div class="calendar-legend">
                <span><i class="english-dot"></i>英语</span>
                <span><i class="mandarin-dot"></i>中文</span>
              </div>
              <div class="practice-calendar" id="practiceCalendar"></div>
            </section>

            <section class="translator-card sidebar-translator" aria-label="中英文随手翻译">
              <div class="translator-head">
                <div>
                  <h2>随手翻译</h2>
                  <p class="muted">中转英 / 英转中</p>
                </div>
                <select id="translateDirection" aria-label="翻译方向">
                  <option value="auto">自动判断</option>
                  <option value="zh-en">中转英</option>
                  <option value="en-zh">英转中</option>
                </select>
              </div>
              <div class="translator-grid">
                <textarea id="translateInput" rows="3" placeholder="输入要翻译的中文或英文"></textarea>
                <output class="placeholder" id="translateOutput">翻译结果会显示在这里</output>
              </div>
            </section>
          </aside>

          <div class="workspace-main">
            <nav class="tabs" aria-label="练习模式">
              <button class="tab active" data-tab="english">英文对话</button>
              <button class="tab" data-tab="mandarin">中文普通话</button>
              <button class="tab" data-tab="records">练习记录</button>
              <button class="tab" data-tab="stats">练习统计</button>
              <button class="tab" data-tab="learning">学习建议</button>
              <button class="tab" data-tab="config">模型配置</button>
            </nav>

            <section class="panel active" id="englishPanel">
          <section class="topic-shelf" aria-label="英语练习主题">
            <div class="topic-shelf-head">
              <h2>留学情景</h2>
              <button class="small-action" id="shuffleEnglishTopics">换一组</button>
            </div>
            <div class="topic-grid" id="englishTopics"></div>
          </section>

          <div class="control-grid">
            <label>
              练习主题
              <input id="englishTopic" value="随便聊聊" />
            </label>
            <label>
              声音
              <select id="voiceSelect">
                <option value="marin">marin</option>
                <option value="cedar">cedar</option>
                <option value="coral">coral</option>
                <option value="sage">sage</option>
                <option value="verse">verse</option>
              </select>
            </label>
            <label>
              语速
              <select id="paceSelect">
                <option value="0.9">0.9×</option>
                <option value="1.0" selected>1.0×</option>
                <option value="1.1">1.1×</option>
              </select>
            </label>
            <div class="control-memory">
              <span>对话记忆</span>
              <label class="memory-toggle conversation-memory-toggle">
                <input id="useLearningMemory" type="checkbox" checked />
                <span>继承历史记忆</span>
              </label>
            </div>
          </div>

          <div class="primary-actions">
            <div class="session-state">
              <span class="status-dot idle" id="englishDot"></span>
              <strong id="englishState">未连接</strong>
            </div>
            <button class="primary" id="startEnglish">开始对话</button>
            <button id="pauseEnglish" disabled>暂停对话</button>
            <button id="stopEnglish" disabled>结束并保存</button>
            <button id="analyzeEnglish" disabled>生成点评</button>
            <div class="voice-scope" aria-label="蓝色为用户语音，粉色为教练语音">
              <canvas id="englishWaveCanvas" aria-hidden="true"></canvas>
            </div>
          </div>

          <div class="transcript" id="englishTranscript" aria-live="polite"></div>
          <div class="analysis" id="englishAnalysis"></div>
            </section>

            <section class="panel" id="mandarinPanel">
          <div class="reading-actions">
            <button class="primary" id="generateReading">随机抽题</button>
            <div class="timer" id="readingTimer">倒计时 --</div>
          </div>

          <article class="reading-card">
            <h2 id="readingTitle">等待抽题</h2>
            <p id="readingText"></p>
          </article>

          <div class="reading-record-actions">
            <button id="startReading" disabled>开始录音</button>
            <button id="stopReading" disabled>结束并保存</button>
            <button id="analyzeReading" disabled>生成点评</button>
          </div>

          <div class="mandarin-meter">
            <div>
              <strong id="mandarinRecordState">未录音</strong>
              <span id="mandarinElapsed">00:00</span>
            </div>
            <div class="meter-track" aria-label="普通话录音音量">
              <span id="mandarinLevelBar"></span>
            </div>
            <span id="mandarinDb">-- dB</span>
          </div>

          <div class="analysis" id="mandarinAnalysis"></div>
            </section>

            <section class="panel" id="recordsPanel">
          <div class="record-filter" role="group" aria-label="按语言筛选练习记录">
            <button class="active" type="button" data-record-filter="english" aria-pressed="true">英文</button>
            <button type="button" data-record-filter="mandarin" aria-pressed="false">中文</button>
          </div>
          <div class="records-list" id="recordsList"></div>
            </section>

            <section class="panel" id="statsPanel">
              <div class="stats-summary" id="statsSummary"></div>
              <section class="stats-block">
                <div class="stats-block-head">
                  <h3>每日练习时长</h3>
                  <span>英语 / 中文</span>
                </div>
                <div class="daily-list" id="dailyStats"></div>
              </section>
              <section class="stats-block">
                <div class="stats-block-head">
                  <h3>得分趋势</h3>
                  <span>每条记录</span>
                </div>
                <div class="score-trend" id="scoreTrend"></div>
              </section>
            </section>

            <section class="panel" id="learningPanel">
          <section class="learning-profile learning-profile-page" aria-label="英文学习记忆与综合建议">
            <div class="learning-profile-head">
              <div>
                <h2>学习记忆与总建议</h2>
                <p class="muted" id="learningProfileStatus" aria-live="polite">正在读取历史英文记录</p>
              </div>
              <div class="learning-profile-controls">
                <button id="generateLearningProfile" type="button">更新总建议</button>
              </div>
            </div>
            <div class="learning-profile-content" id="learningProfileContent" hidden></div>
          </section>
            </section>

            <section class="panel" id="configPanel">
          <div class="config-layout">
            <div>
              <h2>模型配置</h2>
              <p class="muted">本地开发时保存在服务器端 `.env.local`，浏览器不会读取已保存的密钥。</p>
            </div>
            <form id="apiKeyForm" class="key-form">
              <label>
                OPENAI_API_KEY
                <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-..." />
              </label>
              <button class="primary" type="submit">保存 Key</button>
              <p class="form-note" id="configMessage"></p>
            </form>
            <form id="modelConfigForm" class="model-config-form">
              <div class="model-list">
                <label class="model-option">
                  <span>实时对话</span>
                  <select id="realtimeModelSelect" aria-label="实时对话模型"></select>
                  <small>英语语音对话</small>
                </label>
                <label class="model-option">
                  <span>点评 / 学习建议</span>
                  <select id="textModelSelect" aria-label="点评和学习建议模型"></select>
                  <small>中英文点评与长期建议</small>
                </label>
                <label class="model-option">
                  <span>随手翻译</span>
                  <select id="translateModelSelect" aria-label="随手翻译模型"></select>
                  <small>停止输入后的自动翻译</small>
                </label>
              </div>
              <div class="model-config-actions">
                <button class="primary" type="submit">保存模型配置</button>
                <p class="form-note" id="modelConfigMessage" aria-live="polite"></p>
              </div>
            </form>
          </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js?v=20260919-8"></script>
  </body>
</html>
